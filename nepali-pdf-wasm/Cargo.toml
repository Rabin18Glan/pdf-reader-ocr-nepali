[package]
name = "nepali-pdf-wasm"
version = "0.1.0"
edition = "2021"
description = "Fast client-side Nepali PDF to Unicode Devanagari OCR & Parser engine in WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
regex = "1.10"
unicode-normalization = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3.42"
